<!DOCTYPE html>
<html>
<head>
    <title>Opening YouTube...</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script>
        const videoId = "1tKU46Qllwo";

        function openYouTubeApp() {
            // Try app first
            window.location = "vnd.youtube://" + videoId;

            // Fallback to browser after short delay
            setTimeout(function () {
                window.location = "https://www.youtube.com/watch?v=" + videoId;
            }, 1200);
        }

        window.onload = openYouTubeApp;
    </script>
</head>

<body>
    <p>Opening YouTube...</p>
</body>
</html>
